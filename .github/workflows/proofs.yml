name: ServiceSetu proofs
on: [push, pull_request]
jobs:
  proof:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[fetch]' -c requirements-lock.txt
      - run: python -m servicesetu prove
      - uses: actions/upload-artifact@v4
        with:
          name: proof-evidence-${{ matrix.os }}
          path: artifacts/
