[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servicesetu"
version = "0.1.0"
description = "Approval-gated local service booking with a Fetch.ai agent mesh"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
fetch = ["uagents>=0.25.5,<0.26", "openai>=1,<3", "stripe>=12,<15", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
include = ["servicesetu*"]
