<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ServiceSetu provider inbox</title><link rel="stylesheet" href="/portal.css"><script src="/portal.js" defer></script></head>
<body><main><p class="eyebrow">SERVICESETU · LOCAL DEMO</p><h1>Provider inbox</h1><p>Only your confirmed bookings are available. Use fictional customer details.</p>
<form id="login"><label for="token">Private provider access token</label><input id="token" type="password" autocomplete="off" required><button>Open inbox</button></form>
<p id="notice" role="status"></p><section id="workspace" hidden><div class="toolbar"><button id="refresh">Refresh bookings</button><button id="logout">Lock inbox</button></div><div class="layout"><section><h2>Confirmed bookings</h2><div id="bookings"></div></section><section><h2 id="heading">Choose a booking</h2><p id="address"></p><div id="messages" aria-live="polite"></div><button id="more" hidden>Load older-to-newer continuation</button><form id="compose" hidden><label for="text">Message customer</label><textarea id="text" maxlength="2000" required rows="4"></textarea><p>Messages coordinate the visit. Price, appointment and scope changes need a separate approval.</p><button>Send message</button></form></section></div></section></main></body></html>
